		<script>
			function loadRemoteData(src) {
				var scriptEl = document.createElement('script');
				scriptEl.src = src.replace(/.*\/(data|js)\//g, 'https://play.pokemonshowdown.com/$1/');
				document.head.appendChild(scriptEl);
			}
			Config.testclient = true;
			(function() {
				if (location.search !== '') {
					var m = /\?~~(([^:\/]*)(:[0-9]*)?)/.exec(location.search);
					if (m) {
						Config.server = {
							id: m[1],
							host: m[2],
							port: (m[3] && parseInt(m[3].substr(1))) || 8000
						};
					} else {
						alert('Unrecognised query string syntax: ' + location.search);
					}
				}
			})();
		</script>

		<script>
			window.onload = () => {
				window.app = new App();

				// Auto-login: reads which profile is active from localStorage (set by the
				// launch-showdown-dual.bat shim), looks up credentials in testclient-key.js
				// (gitignored — passwords never reach the repo), then calls passwordRename
				// once challstr is received and the upkeep check finds no existing session.
				(function() {
					if (typeof SHOWDOWN_AUTO_LOGINS === 'undefined') return;
					var profile = localStorage.showdownProfile;
					if (!profile || !SHOWDOWN_AUTO_LOGINS[profile]) return;
					var creds = SHOWDOWN_AUTO_LOGINS[profile];
					var orig = app.user.receiveChallstr.bind(app.user);
					app.user.receiveChallstr = function(challstr) {
						orig(challstr);
						setTimeout(function() {
							if (!app.user.get('named')) {
								app.user.passwordRename(creds.username, creds.password);
							}
						}, 2000);
					};
				})();

				// --- Permanent analytics/leaderboard tab ---
				var ANALYTICS_ID = 'view-analytics';

				// Create the tab shell (background, not focused) if it doesn't exist,
				// and (re)fetch its page content from the server.
				function ensureAnalyticsTab(doJoin) {
					var room = app.rooms[ANALYTICS_ID];
					if (!room) {
						room = app._addRoom(ANALYTICS_ID, null, true, 'Leaderboard');
						app.updateSideRoom();
						app.updateLayout();
					}
					// room.join() sends "/join view-analytics"; app.send() queues the
					// message if the socket isn't open yet and flushes it on connect.
					if (doJoin && room && room.join) room.join();
					return room;
				}

				// 1. Create the tab as early as prefs allow.
				Storage.whenPrefsLoaded(function () {
					ensureAnalyticsTab(true);
				});

				// 2. (Re)fetch whenever a socket connection is (re)established.
				app.on('init:socketopened', function () {
					ensureAnalyticsTab(true);
				});

				// 3. If the socket is already open by the time we get here, fetch now.
				if (app.socket && app.socket.readyState === 1 /* OPEN */) {
					ensureAnalyticsTab(true);
				}

				// Keep the tab permanent: re-add it shortly after it is closed.
				// Closing a tab calls closeRoom -> app.leaveRoom -> app.removeRoom,
				// so removeRoom is the correct function to wrap (NOT unjoinRoom).
				var _origRemoveRoom = app.removeRoom.bind(app);
				app.removeRoom = function (id, alreadyLeft) {
					_origRemoveRoom(id, alreadyLeft);
					if (id === ANALYTICS_ID) {
						setTimeout(function () { ensureAnalyticsTab(true); }, 100);
					}
				};
			}
		</script>
